# This is a Declarative Automation Bundle definition for Lakehouse-Databricks.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: Lakehouse-Databricks

include:
  - resources/*.yml

sync:
  exclude:
    - data/**
    - .venv/**
    - docs/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8e6d5a22-8ef2.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-8e6d5a22-8ef2.cloud.databricks.com
